packages:
  - .

overrides:
  react-native-reanimated: 4.1.7
  react-native-worklets: 0.5.1
  '@react-native/metro-config': 0.81.5
  # one copy of React Navigation: expo-router's, so every navigator shares its NavigationContainer
  '@react-navigation/native': 7.3.17
  '@react-navigation/core': 7.21.13
  '@react-navigation/elements': 2.9.39
  '@react-navigation/routers': 7.6.4

allowBuilds:
  unrs-resolver: true
  expo-libghostty: true

patchedDependencies:
  expo-libghostty: patches/expo-libghostty.patch
  react-native-svg@15.12.1: patches/react-native-svg@15.12.1.patch
